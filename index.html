<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060609" />

    <!-- Installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:site_name" content="Pixels" />

    <meta name="description" content="Pixels — the social network for gamers. Log and review games, trade gear, and connect with players who play what you play." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700;800&family=Cairo:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
