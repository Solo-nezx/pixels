[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Injects per-post Open Graph tags so shared links preview correctly.
[[edge_functions]]
  function = "og-tags"
  path = "/"

# SPA fallback — serve index.html for all routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
